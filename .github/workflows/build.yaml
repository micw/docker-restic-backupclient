name: Build
on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - '**'
    branches:
      - master

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/restic-backupclient

jobs:
  build:
    name: test, build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build test image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: restic-backupclient:test
      - name: Unit tests in the built image
        run: >-
          docker run --rm -v "$PWD:/tests:ro" -e PYTHONPATH=/scripts
          restic-backupclient:test python3 -m unittest discover -s /tests/test -v
      - name: Local backup, restore, prune and signal smoke tests
        run: |
          python3 test/integration.py restic-backupclient:test
          python3 test/integration_webdav.py restic-backupclient:test
          python3 test/integration_databases.py restic-backupclient:test
      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
